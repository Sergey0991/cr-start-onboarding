<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CR Start — с чего начать</title>
<style>
  :root {
    --orange: #ffb200;
    --orange-2: #f0a400;
    --ink: #212529;
    --muted: #5e6770;
    --line: #e6e6e6;
    --bg: #f3f4f6;
    --green: #218a45;
    --red: #c43b3b;
    --blue: #006ee5;
    --cream: #fff6df;
    --sidebar: 248px;
    --assist: 424px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  ::selection { background: #ffe7a8; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); border: 0;
  }
  .app { display: flex; height: 100vh; min-width: 1180px; }
  .sidebar {
    width: var(--sidebar); flex: none; background: #fff;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 16px 14px; border: 0; background: #fff;
    border-bottom: 1px solid var(--line); text-align: left; width: 100%;
  }
  .brand-mark { width: 34px; height: 22px; flex: none; }
  .brand-name { font-weight: 700; letter-spacing: .02em; color: var(--orange); font-size: 15px; }
  .brand-start {
    display: block; font-size: 10px; letter-spacing: .14em; color: var(--muted); font-weight: 700;
  }
  .nav { overflow: auto; padding: 8px 0 16px; flex: 1; }
  .nav-link {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 14px; border: 0; background: transparent; text-align: left;
    color: #3a3f44; border-radius: 0;
  }
  .nav-link svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .nav-link > span:first-of-type { flex: 1; }
  .nav-link:hover { background: #fafafa; }
  .nav-link[aria-current="page"] {
    background: #f6f6f6; color: var(--ink); font-weight: 650;
    box-shadow: inset 3px 0 0 var(--orange);
  }
  .sub .nav-link { padding-left: 42px; font-size: 13px; }
  .sub { display: none; }
  .nav-group.open .sub { display: block; }
  .chev { margin-left: auto; width: 14px; height: 14px; transition: transform .15s ease; }
  .nav-group.open .chev { transform: rotate(90deg); }
  .priority-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); margin-left: auto; flex: none; }
  .side-foot {
    border-top: 1px solid var(--line); padding: 10px 14px 12px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .side-foot button { border: 0; background: none; color: var(--blue); padding: 0; text-align: left; font-weight: 600; }
  .side-foot span { color: var(--muted); font-size: 12px; }
  .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .stage-bar {
    height: 56px; flex: none; background: #fff; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; padding: 0 18px;
  }
  .stage-bar h1 { font-size: 16px; font-weight: 650; margin: 0; }
  .bar-gap { flex: 1; }
  .company {
    border: 1px solid var(--line); background: #fff; border-radius: 8px;
    padding: 6px 10px; text-align: left;
  }
  .company b { display: block; font-size: 13px; }
  .company small { color: var(--muted); font-size: 11px; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: #fff;
    display: grid; place-items: center;
  }
  .icon-btn svg { width: 16px; height: 16px; stroke: var(--ink); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .stage-body { flex: 1; min-height: 0; overflow: auto; position: relative; }
  .sheet { padding: 20px 24px 36px; max-width: 1040px; }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .sheet h2, .empty-card h2 { margin: 4px 0 8px; font-size: 22px; letter-spacing: -.02em; }
  .lead { margin: 0 0 14px; max-width: 62ch; }
  .map-wrap { position: relative; height: 100%; min-height: 560px; overflow: hidden; background: #d5e4ec; }
  .map-art { position: absolute; inset: 0; width: 100%; height: 100%; }
  .city {
    position: absolute; transform: translate(-50%, -50%);
    font-size: 12px; color: #66717a; pointer-events: none; white-space: nowrap;
  }
  .city::before {
    content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: #9aa6ae; margin-right: 5px; vertical-align: middle;
  }
  .pin {
    position: absolute; transform: translate(-50%, -100%);
    border: 0; background: transparent; padding: 0;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .pin-head {
    width: 14px; height: 14px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.28);
  }
  .pin-head.ok { background: var(--green); }
  .pin-head.warn { background: var(--orange); }
  .pin-label {
    background: #2b2b2b; color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .pin.selected .pin-label { background: var(--ink); outline: 2px solid var(--orange); }
  .map-panel {
    position: absolute; top: 14px; left: 14px; width: 280px;
    background: #fff; border-radius: 12px; border: 1px solid rgba(0,0,0,.06);
    box-shadow: 0 10px 30px rgba(28, 39, 49, .12); padding: 12px; max-height: calc(100% - 28px); overflow: auto;
  }
  .map-panel h2 { font-size: 15px; margin: 0 0 8px; }
  .map-note {
    position: absolute; right: 12px; bottom: 10px; font-size: 11px; color: #5c6b74;
    background: rgba(255,255,255,.8); padding: 3px 8px; border-radius: 99px;
  }
  .empty-card {
    position: absolute; left: 24px; bottom: 24px; width: min(360px, calc(100% - 48px));
    background: #fff; border-radius: 14px; padding: 16px 18px;
    box-shadow: 0 10px 30px rgba(28, 39, 49, .12);
  }
  .trow {
    display: flex; gap: 10px; width: 100%; text-align: left; border: 1px solid transparent;
    background: transparent; border-radius: 8px; padding: 8px; margin-top: 4px;
  }
  .trow:hover { background: #fafafa; }
  .trow.selected { background: var(--cream); border-color: #f0e0b0; }
  .tone { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex: none; }
  .tone.ok { background: var(--green); }
  .tone.warn { background: var(--orange); }
  .trow b { display: block; font-size: 13px; }
  .trow small { display: block; color: var(--muted); font-size: 12px; }
  .banner {
    background: var(--cream); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: 13px;
  }
  .banner.ok { background: #eef8f1; }
  .provider { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .provider button, .periods button {
    border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 5px 10px;
  }
  .provider button.selected, .periods button.selected { background: var(--ink); color: #fff; border-color: var(--ink); }
  .assistant {
    width: var(--assist); flex: none; background: #fff; border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .a-head { padding: 16px 22px 8px; }
  .a-kicker { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .a-progress { margin-top: 2px; font-size: 13px; color: var(--ink); font-weight: 650; }
  .dots { display: flex; gap: 6px; margin-top: 10px; }
  .dots button {
    width: 9px; height: 9px; border-radius: 50%; border: 0; background: #e1e1e1; padding: 0;
  }
  .dots button.on { background: var(--ink); }
  .dots button.hot { box-shadow: 0 0 0 3px #ffe3a3; }
  .a-body { flex: 1; overflow: auto; padding: 6px 22px 16px; }
  .a-body h2 { font-size: 22px; line-height: 1.25; letter-spacing: -.02em; margin: 6px 0 10px; }
  .a-body p { margin: 0 0 10px; }
  .preview { margin: 8px 0 0; padding-left: 18px; color: var(--ink); }
  .preview li { margin: 4px 0; }
  .callout { background: #f6f6f6; border-radius: 10px; padding: 12px 14px; margin: 12px 0; }
  .callout.is-hot { background: var(--cream); box-shadow: inset 3px 0 0 var(--orange); }
  .callout .kicker { margin-bottom: 4px; }
  .callout p { margin: 0; }
  .role-note, .lens-note {
    font-size: 13px; color: #3d4650; background: #f7f9fb; border-radius: 8px; padding: 8px 10px; margin: 8px 0;
  }
  .hint { color: #8d2f2f; background: #fff5f5; border-radius: 8px; padding: 8px 10px; }
  .q-label { margin: 14px 0 6px; font-size: 13px; font-weight: 700; }
  .option {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 9px 10px; margin-top: 6px;
  }
  .option:hover { border-color: #cfcfcf; }
  .option.selected { border-color: var(--ink); background: var(--cream); }
  .dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #c8c8c8; margin-left: auto; flex: none; }
  .option.selected .dot { border-color: var(--ink); background: radial-gradient(circle, var(--ink) 42%, transparent 46%); }
  .a-foot { border-top: 1px solid var(--line); padding: 12px 22px 14px; display: flex; align-items: center; gap: 10px; }
  .primary, .ghost {
    border-radius: 8px; padding: 10px 14px; font-weight: 700; border: 1px solid transparent;
  }
  .primary { background: var(--orange); color: var(--ink); }
  .primary:hover:not(:disabled) { background: var(--orange-2); }
  .primary.is-waiting { opacity: .55; }
  .ghost { background: #fff; border-color: #d5d5d5; }
  .ghost:hover { background: #fafafa; }
  .text-link { border: 0; background: none; color: var(--blue); font-weight: 650; padding: 0; }
  .push { margin-left: auto; }
  .sample {
    display: inline-flex; align-items: center; font-size: 11px; color: var(--muted);
    border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 3px 8px;
  }
  .sample-live { color: var(--green); border-color: #bfe6cb; background: #f3fbf5; }
  .path { display: flex; flex-direction: column; gap: 8px; max-width: 640px; }
  .path-row {
    display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px;
  }
  .path-row.is-hot { background: var(--cream); border-color: #f0d48a; }
  .num {
    width: 26px; height: 26px; border-radius: 50%; background: #f3f4f6;
    display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none;
  }
  .path-row.is-hot .num { background: var(--orange); }
  .tag { margin-left: auto; font-size: 12px; font-weight: 700; color: #8a5a00; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px;
  }
  .card h3 { margin: 2px 0 8px; font-size: 16px; }
  .meta { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .price { font-size: 20px; font-weight: 700; margin: 6px 0; }
  .picker { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .picker button.choice {
    text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 10px;
  }
  .picker button.choice.selected { border-color: var(--ink); background: var(--cream); }
  .split { display: grid; grid-template-columns: 1.15fr .85fr; gap: 16px; align-items: start; }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { display: flex; gap: 10px; padding: 6px 0; }
  .mark {
    width: 16px; height: 16px; border-radius: 50%; border: 2px solid #d0d0d0; margin-top: 2px; flex: none;
  }
  .timeline .done .mark { background: var(--green); border-color: var(--green); }
  .timeline .current .mark { border-color: var(--orange); background: var(--orange); }
  .timeline .done span, .timeline .current b { font-weight: 650; }
  .delay {
    margin-top: 8px; background: #fff1f1; color: #8d2f2f; border-radius: 8px; padding: 8px 10px; font-size: 13px;
  }
  .phone {
    background: #1c1e21; color: #fff; border-radius: 22px; padding: 14px 12px 16px;
    box-shadow: 0 12px 28px rgba(0,0,0,.12);
  }
  .phone-top { font-size: 12px; color: #c8c8c8; display: flex; justify-content: space-between; }
  .phone h3 { margin: 12px 0 4px; font-size: 16px; }
  .phone p { margin: 0 0 8px; color: #e8e8e8; font-size: 13px; }
  .phone .primary { width: 100%; }
  .chat { display: flex; flex-direction: column; gap: 8px; }
  .bubble { border-radius: 10px; padding: 8px 10px; font-size: 13px; max-width: 95%; }
  .bubble.driver { background: #f3f4f6; }
  .bubble.me { background: var(--cream); margin-left: auto; }
  .bubble.system { background: #eef5fb; color: #20415c; }
  .chat-form { display: flex; gap: 8px; margin-top: 8px; }
  .chat-form input {
    flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #fff;
  }
  .gantt { display: flex; flex-direction: column; gap: 8px; }
  .ticks { display: flex; justify-content: space-between; margin: 0 0 6px 158px; color: var(--muted); font-size: 12px; }
  .lane { display: grid; grid-template-columns: 148px 1fr; gap: 10px; align-items: center; }
  .lane b { font-size: 13px; display: block; }
  .lane small { color: var(--muted); }
  .track { position: relative; height: 38px; background: #eef0f2; border-radius: 8px; }
  .now-line { position: absolute; left: 8%; top: 0; bottom: 0; width: 2px; background: var(--red); }
  .bar {
    position: absolute; top: 7px; height: 24px; border-radius: 6px; font-size: 11px;
    display: flex; align-items: center; padding: 0 8px; white-space: nowrap; overflow: hidden;
  }
  .bar.trip { background: #ffe08a; }
  .bar.busy { background: #d5dbe1; }
  .bar.back { background: #cfeedd; }
  .plan { display: flex; flex-direction: column; gap: 16px; }
  .miss { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 8px 0; border-top: 1px solid var(--line); }
  .miss span { color: var(--muted); text-align: right; }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 12px 0; }
  .metric { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .metric span { color: var(--muted); font-size: 12px; }
  .metric strong { display: block; font-size: 24px; margin-top: 4px; letter-spacing: -.03em; }
  .bars { height: 120px; display: flex; align-items: flex-end; gap: 8px; margin-top: 8px; }
  .bars span { flex: 1; background: var(--orange); border-radius: 5px 5px 0 0; }
  .doc-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .checks { display: flex; flex-direction: column; gap: 10px; }
  .check {
    display: flex; gap: 12px; width: 100%; text-align: left; background: #fff;
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  }
  .check.hot { border-color: #f0d48a; background: #fffaf0; }
  .check .num.done { background: var(--green); color: #fff; }
  .rows { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .rowline {
    background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  .rowline b { display: block; }
  .rowline span { color: var(--muted); font-size: 13px; }
  .ok { color: var(--green); font-weight: 650; }
  .reopen {
    position: fixed; right: 22px; bottom: 22px; z-index: 6;
    background: var(--orange); border: 0; border-radius: 999px; padding: 12px 16px; font-weight: 750;
    box-shadow: 0 8px 24px rgba(0,0,0,.14);
  }
  #toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(12px);
    background: #212529; color: #fff; padding: 10px 14px; border-radius: 10px;
    max-width: min(520px, calc(100% - 40px)); opacity: 0; pointer-events: none;
    transition: .2s ease; z-index: 7; font-size: 13px;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .shake { animation: shake .35s linear; }
  @keyframes shake {
    25% { transform: translateX(-2px); }
    50% { transform: translateX(3px); }
    75% { transform: translateX(-2px); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>

function fresh() {
  return {
    v: 1,
    stepId: "welcome",
    role: null,
    pain: null,
    fleet: null,
    collapsed: false,
    aside: null,
    lens: null,
    open: { chats: false, planning: false, refs: false },
    connected: false,
    provider: null,
    tried: false,
    triedConnect: false,
    dirs: { truck: false, driver: false, client: false },
    tripLive: false,
    truckId: "a777",
    pick: "a777",
    status: 0,
    delayDemo: false,
    loadTaken: false,
    invoice: false,
    act: false,
    period: "week",
    selectedTruck: "a777",
    messages: []
  };
}

function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || "null");
    if (!raw || raw.v !== 1) return fresh();
    const base = fresh();
    return {
      ...base,
      ...raw,
      open: { ...base.open, ...(raw.open || {}) },
      dirs: { ...base.dirs, ...(raw.dirs || {}) },
      messages: Array.isArray(raw.messages) ? raw.messages : []
    };
  } catch (e) {
    return fresh();
  }
}

let state = loadState();

function icon(name) {
  return `<svg viewBox="0 0 18 18" aria-hidden="true">${ICONS[name] || ""}</svg>`;
}

function stepIndex() { return STEPS.findIndex((s) => s.id === state.stepId); }
function tourSteps() { return STEPS.filter((s) => s.kind === "tour"); }
function storyId() { return state.tripLive ? state.truckId : "a777"; }
function story() { return TRUCKS[storyId()]; }
function canNext() {
  if (state.stepId !== "questions") return true;
  return Boolean(state.role && state.pain && state.fleet);
}
function priorityStep() {
  return { gps: "monitoring", chaos: "trips", money: "finance", empty: "planning" }[state.pain] || "";
}
function priorityNav() {
  return { gps: "monitoring", chaos: "bids", money: "finance", empty: "planning" }[state.pain] || "";
}
function priorityAction() {
  return { gps: "connect", chaos: "first", money: "first", empty: "first" }[state.pain] || "";
}
function checks() {
  return {
    connect: state.connected,
    dirs: state.dirs.truck && state.dirs.driver && state.dirs.client,
    first: state.tripLive
  };
}
function showDelay() { return state.delayDemo || state.lens === "delay"; }

function nowInfo(id) {
  const t = TRUCKS[id];
  if (id === "m018") {
    return { tone: "warn", status: "На погрузке", place: t.place, extra: "Сейчас занята. К 18 ноября освободится." };
  }
  const hasTrip = state.tripLive && storyId() === id;
  return {
    tone: "ok",
    status: "Свободна",
    place: t.place,
    extra: hasTrip ? "Заявка 2418 · 18 ноября, сегодня ещё не в рейсе" : "Заявки нет"
  };
}

function currentId() {
  if (state.aside) {
    return { tasks: "tasks", transport: "transport", admin: "admin", trailers: "ref-trailers" }[state.aside] || "";
  }
  const s = state.stepId;
  const l = state.lens;
  if (s === "welcome" || s === "monitoring") return l === "connect" ? "monitoring" : "monitoring";
  if (s === "questions") return "";
  if (s === "trips") return l === "orders" ? "orders" : "bids";
  if (s === "control") {
    if (l === "chat") return "chat-drivers";
    if (l === "truckchat") return "chat-trucks";
    if (l === "delay") return "notifications";
    return "bids";
  }
  if (s === "planning") {
    if (l === "cities") return "by-cities";
    if (l === "loads") return "loads";
    return "by-trucks";
  }
  if (s === "finance") return "finance";
  if (s === "dashboard") {
    if (l === "assistant") return "assistant";
    if (l === "reports") return "reports";
    return "dashboard";
  }
  if (s === "today") return l === "connect" ? "monitoring" : "refs";
  return "";
}

function findItem(id) {
  for (const item of NAV) {
    if (item.id === id) return item;
    if (item.children) {
      const child = item.children.find((x) => x.id === id);
      if (child) return child;
    }
  }
  return null;
}

function ensureGroupOpen() {
  const map = { control: "chats", planning: "planning", today: "refs" };
  const g = map[state.stepId];
  if (g) state.open[g] = true;
}

function sectionTitle() {
  if (state.aside && ASIDES[state.aside]) return ASIDES[state.aside].title;
  if (state.stepId === "today" && state.lens === "connect") return "Мониторинг";
  if (state.stepId === "today" && state.lens === "dirs") return "Справочники";
  if (state.stepId === "today" && state.lens === "first") return "Заявки";
  if (state.stepId === "planning" && state.lens === "loads") return "Доступные заказы";
  if (state.stepId === "planning" && state.lens === "cities") return "Планирование · по городам";
  if (state.stepId === "planning") return "Планирование · по машинам";
  if (state.stepId === "control" && state.lens === "chat") return "Чаты с водителями";
  if (state.stepId === "control" && state.lens === "truckchat") return "Чаты по грузовикам";
  if (state.stepId === "control" && state.lens === "delay") return "Уведомления";
  if (state.stepId === "dashboard" && state.lens === "reports") return "Отчеты";
  if (state.stepId === "dashboard" && state.lens === "assistant") return "Ассистент";
  const step = STEPS.find((s) => s.id === state.stepId);
  return step ? step.section : "";
}

function badges() {
  const bits = [];
  if (state.stepId === "monitoring" || state.lens === "connect" || state.stepId === "welcome") {
    bits.push(state.connected
      ? '<span class="sample sample-live">Мониторинг подключён</span>'
      : '<span class="sample">Своих машин пока нет</span>');
    if (state.stepId !== "welcome") bits.push('<span class="sample">На карте — пример</span>');
  } else if (["trips", "control", "planning", "finance"].includes(state.stepId) || state.lens === "first") {
    bits.push(state.tripLive
      ? '<span class="sample sample-live">Заявка 2418</span>'
      : '<span class="sample">Учебный пример</span>');
  }
  return bits.join(" ");
}

function progressLabel() {
  const tour = tourSteps();
  const i = tour.findIndex((s) => s.id === state.stepId);
  if (i < 0) return state.stepId === "questions" ? "Три вопроса" : "Добро пожаловать";
  return `Шаг ${i + 1} из ${tour.length}`;
}

function dots() {
  if (state.stepId === "welcome" || state.stepId === "questions" || state.aside) return "";
  const hot = priorityStep();
  return `<div class="dots">${tourSteps().map((s) => {
    const cls = [s.id === state.stepId ? "on" : "", s.id === hot ? "hot" : ""].filter(Boolean).join(" ");
    return `<button type="button" class="${cls}" data-action="goto" data-step="${s.id}" aria-label="${s.short}" title="${s.short}"></button>`;
  }).join("")}</div>`;
}

function navLink(item, current) {
  const kids = item.children;
  const open = kids && state.open[item.group];
  const active = item.id === current;
  const pri = item.id === priorityNav();
  const chev = kids ? `<svg class="chev" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 4.5 11.5 9 7 13.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>` : "";
  const dot = pri ? '<span class="priority-dot" title="Вам это полезнее всего"></span>' : "";
  return `<button type="button" class="nav-link" data-action="nav" data-id="${item.id}" ${active ? 'aria-current="page"' : ""}>
    ${icon(item.icon || "box")}<span>${item.label}</span>${dot}${chev}
  </button>`;
}

function sidebar() {
  const current = currentId();
  const items = NAV.map((item) => {
    if (!item.children) return navLink(item, current);
    const open = state.open[item.group] ? "open" : "";
    return `<div class="nav-group ${open}">${navLink(item, current)}<div class="sub">${item.children.map((child) => {
      const active = child.id === current ? 'aria-current="page"' : "";
      return `<button type="button" class="nav-link" data-action="nav" data-id="${child.id}" ${active}><span>${child.label}</span></button>`;
    }).join("")}</div></div>`;
  }).join("");
  return `<nav class="sidebar" aria-label="Разделы CR Start">
    <button type="button" class="brand" data-action="goto" data-step="welcome" aria-label="В начало знакомства">
      <svg class="brand-mark" viewBox="0 0 40 26" aria-hidden="true">

      </svg>
      <span><span class="brand-name">CARGO.RUN</span><span class="brand-start">START</span></span>

    <div class="nav">${items}</div>
    <div class="side-foot">
      <button type="button" data-action="restart">Начать сначала</button>
      <span>Прототип знакомства</span>
    </div>
  </nav>`;
}

function truckPanel() {
  if (state.lens === "connect") return connectPanel();
  const rows = Object.entries(TRUCKS).map(([id, t]) => {
    const info = nowInfo(id);
    const on = state.selectedTruck === id ? "selected" : "";
    const tripLine = state.tripLive && storyId() === id ? `<small>${info.extra}</small>` : "";
    return `<button type="button" class="trow ${on}" data-action="select-truck" data-id="${id}">
      <span class="tone ${info.tone}"></span>
      <span><b>${t.plate}</b><small>${info.status} · ${info.place}</small>${tripLine}${on ? `<small>${t.model} · ${t.body} · ${t.driver}</small>${tripLine ? "" : `<small>${info.extra}</small>`}` : ""}</span>

  }).join("");

    ? '<div class="banner ok">Учебный кабинет подключён. Ниже — как выглядит карта с рейсами, это не ваши машины.</div>'

function pathList() {
  const hot = priorityStep();
  const rows = tourSteps().map((s, i) => {
    const isHot = s.id === hot;
    return `<div class="path-row ${isHot ? "is-hot" : ""}"><span class="num">${i + 1}</span><span>${s.short}</span>${isHot ? '<span class="tag">сначала вам</span>' : ""}</div>`;

function footRow(primary, withJump) {
  const waiting = state.stepId === "questions" && !canNext() ? "is-waiting" : "";
  const jump = withJump ? '<button type="button" class="text-link" data-action="goto" data-step="today">К делам</button>' : "";
  return `<div class="a-foot">
    <button type="button" class="ghost" data-action="back">Назад</button>
    <span class="push" style="display:flex;gap:12px;align-items:center">${jump}
      <button type="button" class="primary ${waiting}" data-action="next">${primary}</button>
    </span>
  </div>`;
}

function reopen() {
  return `<button type="button" class="reopen" data-action="expand">С чего начать</button>`;
}

function view() {
  return `<div class="app">${sidebar()}${stage()}${state.collapsed ? "" : assistant()}</div>${state.collapsed ? reopen() : ""}`;
}

function render() {
  if (!STEPS.some((s) => s.id === state.stepId)) state.stepId = "welcome";
  document.getElementById("app").innerHTML = view();
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* прототип живёт и без хранения */ }
}

function goto(step, lens) {
  if (!STEPS.some((s) => s.id === step)) return;
  state.stepId = step;
  state.lens = lens || null;
  state.aside = null;
  ensureGroupOpen();
  render();
}

function next() {
  if (!canNext()) {
    state.tried = true;
    render();
    requestAnimationFrame(() => {
      const button = document.querySelector("[data-action='next']");
      if (!button) return;
      button.classList.remove("shake");
      void button.offsetWidth;
      button.classList.add("shake");
    });
    return;
  }
  const i = stepIndex();
  if (i < STEPS.length - 1) {
    state.stepId = STEPS[i + 1].id;
    state.lens = null;
    state.aside = null;
    ensureGroupOpen();
    render();
  } else done();
}

function back() {
  if (state.aside) { state.aside = null; render(); return; }
  const i = stepIndex();
  if (i > 0) {
    state.stepId = STEPS[i - 1].id;
    state.lens = null;
    state.aside = null;
    ensureGroupOpen();
    render();
  }
}

function done() {
  state.collapsed = true;
  state.aside = null;
  render();
  toast("Панель можно вернуть кнопкой «С чего начать» внизу справа.");
}

function toast(message) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove("show"), 3600);
}

function activate(item) {
  if (!item) return;
  if (item.children) {
    state.open[item.group] = !state.open[item.group];
    render();
    return;
  }
  if (item.aside) {
    state.aside = item.aside;
    state.lens = null;
    render();
    return;
  }
  state.aside = null;
  state.stepId = item.step;
  state.lens = item.lens || null;
  ensureGroupOpen();
  render();
}

function confirmTrip() {
  state.tripLive = true;
  state.truckId = state.pick || "a777";
  render();
}

function onClick(event) {
  const btn = event.target.closest("[data-action]");
  if (!btn || !document.getElementById("app").contains(btn)) return;
  const action = btn.dataset.action;
  if (action === "next") return next();
  if (action === "back") return back();
  if (action === "done") return done();
  if (action === "expand") { state.collapsed = false; render(); return; }
  if (action === "goto") return goto(btn.dataset.step, btn.dataset.lens || null);
  if (action === "skip-today") return goto("today");
  if (action === "restart") {
    state = fresh();
    try { localStorage.removeItem(KEY); } catch (e) {}
    render();
    toast("Знакомство начато заново.");
    return;
  }
  if (action === "nav") return activate(findItem(btn.dataset.id));
  if (action === "close-aside" || action === "clear-lens") { state.aside = null; state.lens = null; render(); return; }
  if (action === "set-lens") { state.lens = btn.dataset.lens; state.aside = null; render(); return; }
  if (action === "pick" && ["role", "pain", "fleet"].includes(btn.dataset.group)) {
    state[btn.dataset.group] = btn.dataset.value;
    render();
    return;
  }
  if (action === "info") return toast(btn.dataset.message || "");
  if (action === "select-truck") { state.selectedTruck = btn.dataset.id; render(); return; }
  if (action === "provider") { state.provider = btn.dataset.value; render(); return; }
  if (action === "connect") {
    if (!state.provider) { state.triedConnect = true; render(); return; }
    state.connected = true;
    render();
    return;
  }
  if (action === "pick-truck") { state.pick = btn.dataset.id; render(); return; }
  if (action === "confirm-trip") return confirmTrip();
  if (action === "status-next" && state.status < 4) { state.status += 1; render(); return; }
  if (action === "toggle-delay") { state.delayDemo = !state.delayDemo; render(); return; }
  if (action === "take-load") { state.loadTaken = true; render(); return; }
  if (action === "make-invoice") { state.invoice = true; render(); return; }
  if (action === "make-act" && state.status >= 4) { state.act = true; render(); return; }
  if (action === "finish-trip") { state.status = 4; render(); return; }
  if (action === "period") { state.period = btn.dataset.value; render(); return; }
  if (action === "add-dir" && ["truck", "driver", "client"].includes(btn.dataset.id)) {
    state.dirs[btn.dataset.id] = true;
    render();
    return;
  }
  if (action === "send-chat") {
    const input = document.getElementById("chat-draft");
    const text = (input && input.value || "").trim();
    if (!text) return;
    state.messages.push({ lens: state.lens, text });
    render();
  }
}

document.getElementById("app").addEventListener("click", onClick);
document.addEventListener("keydown", (event) => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  if (event.target.closest("input, textarea")) return;
  if (event.key === "ArrowRight") { event.preventDefault(); next(); }
  if (event.key === "ArrowLeft") { event.preventDefault(); back(); }
});

window.__cr = { get state() { return state; }, goto, next, back };
render();
</script>
</body>
</html>
